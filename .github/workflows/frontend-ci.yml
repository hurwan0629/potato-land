name: Frontend CI

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "client/**"
      - ".github/workflows/frontend-ci.yml"
  
  push:
    branches:
      - main
      - develop
    paths:
      - "client/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client
    
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      
      - run: npm ci
      - run: npm run lint
      - run: npm run build
